<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-label="Com subagentes, cada papel num agente e o seal escondido de quem implementa; solo, um agente só, com os testes primeiro, visíveis e travados pelo Basecamp">
<title>Com subagentes, cada papel num agente e o seal escondido de quem implementa; solo, um agente só, com os testes primeiro, visíveis e travados pelo Basecamp</title>
<rect width="960" height="430" rx="10" fill="#F3F4F1"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#596068"/></marker></defs><text x="40" y="52" font-family="Archivo, 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="800" fill="#1A1D20">Com vários agentes ou com um só</text>
<text x="40" y="76" font-family="'Martian Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#596068">o agente escolhe no começo: mohs climb, ou mohs climb --solo quando não pode criar subagentes</text>
<text x="40" y="112" font-family="'Martian Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#1A1D20">COM SUBAGENTES · Claude Code</text>
<rect x="40" y="124" width="170" height="62" rx="6" fill="#E7E8E3" stroke="#CBCDC6"/>
<text x="52" y="150" font-family="Archivo, 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="800" fill="#1A1D20">Planejador</text>
<text x="52" y="170" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#596068">plano, line e bolts</text>
<rect x="250" y="104" width="170" height="62" rx="6" fill="#E7E8E3" stroke="#CBCDC6"/>
<text x="262" y="130" font-family="Archivo, 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="800" fill="#B85E76">Belayer</text>
<text x="262" y="150" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#596068">seal escondido</text>
<rect x="250" y="176" width="170" height="62" rx="6" fill="#F3F4F1" stroke="#CBCDC6"/>
<text x="262" y="202" font-family="Archivo, 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="800" fill="#E4531B">Climber</text>
<text x="262" y="222" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#596068">sobe ao mesmo tempo</text>
<rect x="460" y="124" width="170" height="62" rx="6" fill="#E7E8E3" stroke="#CBCDC6"/>
<text x="472" y="150" font-family="Archivo, 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="800" fill="#1A1D20">Send</text>
<text x="472" y="170" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#596068">roda o seal</text>
<rect x="670" y="124" width="250" height="62" rx="6" fill="#E7E8E3" stroke="#CBCDC6"/>
<text x="682" y="150" font-family="Archivo, 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="800" fill="#1A1D20">Inspector</text>
<text x="682" y="170" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#596068">outro agente, que não escreveu o código</text>
<path d="M 210 150 L 246 138" stroke="#596068" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M 210 160 L 246 204" stroke="#596068" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M 420 136 L 456 148" stroke="#596068" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M 420 206 L 456 170" stroke="#596068" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M 630 155 L 666 155" stroke="#596068" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="236" y="96" width="198" height="150" rx="8" fill="none" stroke="#B85E76" stroke-dasharray="4 4"/>
<text x="246" y="262" font-family="'Martian Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#B85E76">em paralelo · o climber nunca vê o seal</text>
<path d="M 40 290 h 880" stroke="#CBCDC6"/>
<text x="40" y="318" font-family="'Martian Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#1A1D20">SOLO · um agente, como num chat do Copilot</text>
<rect x="40" y="330" width="170" height="62" rx="6" fill="#E7E8E3" stroke="#CBCDC6"/>
<text x="52" y="356" font-family="Archivo, 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="800" fill="#1A1D20">Plano + line</text>
<text x="52" y="376" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#596068">numa tarefa só, sem bolts</text>
<rect x="250" y="330" width="170" height="62" rx="6" fill="#E7E8E3" stroke="#CBCDC6"/>
<text x="262" y="356" font-family="Archivo, 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="800" fill="#5E8F72">Testes primeiro</text>
<text x="262" y="376" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#596068">visíveis e travados</text>
<rect x="460" y="330" width="170" height="62" rx="6" fill="#F3F4F1" stroke="#CBCDC6"/>
<text x="472" y="356" font-family="Archivo, 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="800" fill="#E4531B">Código</text>
<text x="472" y="376" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#596068">lê os testes travados</text>
<rect x="670" y="330" width="250" height="62" rx="6" fill="#E7E8E3" stroke="#CBCDC6"/>
<text x="682" y="356" font-family="Archivo, 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="800" fill="#1A1D20">Send e inspeção</text>
<text x="682" y="376" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#596068">roda a cópia do Basecamp e se revisa</text>
<path d="M 210 361 L 246 361" stroke="#596068" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M 420 361 L 456 361" stroke="#596068" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M 630 361 L 666 361" stroke="#596068" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="250" y="414" font-family="'Martian Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#5E8F72">um segredo que o próprio autor conhece não prova nada: no solo o teste é trava, não segredo</text>
</svg>
