<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="960" height="250" role="img" aria-label="A régua de evidência de cada summit: nenhuma, fraca (só checagens sem teste), média (um tipo de prova) e forte (dois tipos de prova)">
<title>A régua de evidência de cada summit: nenhuma, fraca (só checagens sem teste), média (um tipo de prova) e forte (dois tipos de prova)</title>
<rect width="960" height="250" rx="10" fill="#F3F4F1"/>
<text x="40" y="52" font-family="Archivo, 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="800" fill="#1A1D20">Todo summit diz o que o provou</text>
<text x="40" y="76" font-family="'Martian Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#596068">o agente nunca diz que passou: o Basecamp roda e conta · evidência fraca pede que você revise o diff</text>
<rect x="40" y="100" width="213" height="14" rx="3" fill="#B83227" opacity="0.35"/>
<text x="40" y="146" font-family="Archivo, 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="800" fill="#B83227">nenhuma</text>
<text x="40" y="172" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#596068">nada rodou além</text>
<text x="40" y="190" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#596068">do commit</text>
<rect x="262" y="100" width="213" height="14" rx="3" fill="#94660B" opacity="0.55"/>
<text x="262" y="146" font-family="Archivo, 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="800" fill="#94660B">fraca</text>
<text x="262" y="172" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#596068">só checagens sem teste:</text>
<text x="262" y="190" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#596068">build, lint, typecheck</text>
<rect x="484" y="100" width="213" height="14" rx="3" fill="#2A83A8" opacity="0.75"/>
<text x="484" y="146" font-family="Archivo, 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="800" fill="#2A83A8">média</text>
<text x="484" y="172" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#596068">um tipo de prova: testes</text>
<text x="484" y="190" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#596068">do projeto, seal ou repro</text>
<rect x="706" y="100" width="213" height="14" rx="3" fill="#5E8F72" opacity="0.9500000000000001"/>
<text x="706" y="146" font-family="Archivo, 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="800" fill="#5E8F72">forte</text>
<text x="706" y="172" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#596068">dois tipos: seal, testes</text>
<text x="706" y="190" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#596068">travados ou repro, mais os</text>
<text x="706" y="208" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#596068">testes do projeto</text>
</svg>
